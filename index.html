        .fade-in { 
            animation: fadeIn 0.6s ease-out; 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        /* Ajuste para las imágenes de relleno */
        .img-placeholder {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }

        }

        }
    </style>

        function startGame() {
            showNode('inicio');
        }

        function showNode(nodeId) {
            const node = storyData[nodeId];
            const gameCard = document.getElementById('game-card');
            
            // Reiniciar la animación de desvanecimiento
            gameCard.classList.remove('fade-in');
            void gameCard.offsetWidth; // Forzar el repintado
            gameCard.classList.add('fade-in');
            
            // Actualizar el texto
            document.getElementById('story-text').innerHTML = node.texto;
            
            // Actualizar la imagen o video
            const imgElement = document.getElementById('story-image');
            const videoElement = document.getElementById('story-video');
            const collageElement = document.getElementById('collage-container');
            const imgContainer = document.getElementById('image-container');
            
            // Pausar el video anterior si estaba reproduciéndose
            videoElement.pause();
            videoElement.currentTime = 0;
            
            // Ocultar todo por defecto
            imgElement.classList.add('hidden');
            videoElement.classList.add('hidden');
            collageElement.classList.add('hidden');
            collageElement.classList.remove('grid');
            
            if (node.imagenes_collage && node.imagenes_collage.length > 0) {
                // Si hay un collage de imágenes
                collageElement.innerHTML = ''; // Limpiar fotos anteriores
                node.imagenes_collage.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.className = 'w-full h-40 object-cover rounded-xl shadow-md border-2 border-white hover:scale-105 transition-transform duration-300';
                    collageElement.appendChild(img);
                });
                collageElement.classList.remove('hidden');
                collageElement.classList.add('grid'); // Activar grid
                imgContainer.style.display = 'block';
            } else if (node.video && node.video !== "") {
                // Si hay video, mostramos el video
                videoElement.src = node.video;
                videoElement.classList.remove('hidden');
                imgContainer.style.display = 'block';
            } else if (node.imagen && node.imagen !== "") {
                // Si hay imagen, mostramos la imagen
                imgElement.src = node.imagen;
                imgElement.classList.remove('hidden');
                imgContainer.style.display = 'block';
            } else {
                // Si no hay ni foto ni video ni collage, ocultamos todo el contenedor
                imgContainer.style.display = 'none'; 
            }
            
            // Actualizar los botones
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = ''; // Limpiar botones anteriores
            
            node.opciones.forEach(opcion => {
                const button = document.createElement('button');
                button.className = 'w-full bg-gradient-to-r from-orange-400 to-pink-500 hover:from-orange-500 hover:to-pink-600 text-white font-bold py-4 px-6 rounded-full transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg hover:shadow-orange-300/50 flex items-center justify-center text-center serif-font text-xl tracking-wide';
                button.innerText = opcion.texto;
                button.onclick = () => showNode(opcion.destino);
                choicesContainer.appendChild(button);
            });
        }

        // Iniciar el juego en cuanto cargue la ventana
        window.onload = function() {
            startGame();
        };
